<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Warm cream outer ticket base -->
  <rect width="32" height="32" rx="4" fill="#fff8e8"/>
  <!-- Deep basil market stamp -->
  <rect x="2" y="2" width="28" height="28" rx="3" fill="#173c2a"/>
  <!-- Ticket perforated notched border -->
  <rect x="4.5" y="4.5" width="23" height="23" rx="2" fill="none" stroke="#fff8e8" stroke-width="1" stroke-dasharray="2 1.5"/>
  <!-- Central market typography 'P' -->
  <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="16" font-weight="900" fill="#fff8e8">P</text>
  <!-- Tomato red produce pip -->
  <circle cx="21.5" cy="11.5" r="3.5" fill="#c94c38"/>
  <circle cx="21.5" cy="11.5" r="1.5" fill="#fff8e8"/>
</svg>
